app:
  name: basic-v2-fe

image:
  repository: ghcr.io/edutams/basic_v2_fe
  tag: sha-e8525c8
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

replicas: 2

resources:
  requests:
    memory: "32Mi"
    cpu: "20m"
  limits:
    memory: "128Mi"
    cpu: "200m"

backend:
  service: basic-v2-be-service
  paths:
    - /tenancy/assets

ingress:
  hosts:
    - oneskool.net
    - "*.oneskool.net"
    - oneskool.ng
    - "*.oneskool.ng"
  tls:
    enabled: true

certificates:
  issuer: letsencrypt-dns-cloudflare
  items:
    - secretName: oneskool-net-tls
      dnsNames:
        - oneskool.net
        - "*.oneskool.net"
    - secretName: oneskool-ng-tls
      dnsNames:
        - oneskool.ng
        - "*.oneskool.ng"
