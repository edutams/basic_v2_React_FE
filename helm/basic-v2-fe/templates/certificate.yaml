{{- range .Values.certificates.items }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .secretName }}
spec:
  secretName: {{ .secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $.Values.certificates.issuer }}
  dnsNames:
    {{- range .dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
