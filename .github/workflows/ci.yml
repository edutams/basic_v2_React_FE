name: CI — Build, Push & Scan

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/edutams/basic_v2_fe
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_CENTRAL_DOMAIN=${{ secrets.VITE_CENTRAL_DOMAIN }}
            VITE_PUSHER_APP_KEY=${{ secrets.VITE_PUSHER_APP_KEY }}
            VITE_PUSHER_APP_CLUSTER=${{ secrets.VITE_PUSHER_APP_CLUSTER }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose pushed image reference
        id: ref
        run: echo "image=ghcr.io/edutams/basic_v2_fe:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ needs.build-push.outputs.image }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  call-cd:
    name: Trigger CD Workflow
    needs: build-push
    uses: ./.github/workflows/cd.yml
    secrets: inherit
